name: P8II v1.06.68a Formal Source Assemble
on:
  push:
    branches:
      - showpei1203/sho-56-p8-ii-deterministic-battle-regression-consolidation-i
    paths:
      - '.github/workflows/p8ii_promote_10668a.yml'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: showpei1203/sho-56-p8-ii-deterministic-battle-regression-consolidation-i
      - name: Assemble exact source
        shell: bash
        run: |
          cat .promotion/p8ii_10668a_part*.b64 | tr -d '\n' | base64 -d > exported_scripts/0650__id_1066800.rb
          test "$(sha256sum exported_scripts/0650__id_1066800.rb | cut -d' ' -f1)" = "3b32632d163107877042406c4bfca1e07073bbb17078a940f4b6f88e594a343d"
          test "$(wc -c < exported_scripts/0650__id_1066800.rb | tr -d ' ')" = "23966"
          git mv exported_scripts/0650__id_250.rb exported_scripts/0651__id_250.rb
          git mv exported_scripts/0651__id_251.rb exported_scripts/0652__id_251.rb
      - name: Refresh manifests
        shell: python
        run: |
          from pathlib import Path
          idx=Path('exported_scripts/SCRIPT_INDEX.tsv')
          lines=[x for x in idx.read_text(encoding='utf-8').splitlines() if not x.startswith('650\t') and not x.startswith('651\t')]
          lines += [
            '650\t1066800\tPMD AutoChess P8-II Deterministic Battle Regression Consolidation I v1.06.68a\t0650__id_1066800.rb\t23966\t3b32632d163107877042406c4bfca1e07073bbb17078a940f4b6f88e594a343d',
            '651\t250\tMain\t0651__id_250.rb\t571\t8fdfe50524b8d32a91901e636c6100dba33a42baa6ff09a8153f31786a585558',
            '652\t251\t\t0652__id_251.rb\t0\te3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855']
          idx.write_text('\n'.join(lines),encoding='utf-8')
          order=Path('exported_scripts/SCRIPT_ORDER.md')
          ol=[x for x in order.read_text(encoding='utf-8').splitlines() if not x.startswith('- 0650 ') and not x.startswith('- 0651 ')]
          ol += [
            '- 0650 | ID `1066800` | `PMD AutoChess P8-II Deterministic Battle Regression Consolidation I v1.06.68a` | `0650__id_1066800.rb`',
            '- 0651 | ID `250` | `Main` | `0651__id_250.rb`',
            '- 0652 | ID `251` | `` | `0652__id_251.rb`']
          order.write_text('\n'.join(ol),encoding='utf-8')
      - name: Commit assembled source
        shell: bash
        run: |
          rm -rf .promotion
          rm -f .github/workflows/p8ii_promote_10668a.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Assemble v1.06.68a P8-II formal source authority"
          git push origin HEAD:showpei1203/sho-56-p8-ii-deterministic-battle-regression-consolidation-i