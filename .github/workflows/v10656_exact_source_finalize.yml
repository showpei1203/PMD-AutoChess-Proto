name: v1.06.56 Exact Source Finalizer
on:
  push:
    branches: [develop]
    paths:
      - '.v10656_import/**'
      - '.github/workflows/v10656_exact_source_finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Rebuild exact script and manifests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          root=Path('.')
          parts=[(root/'.v10656_import'/f'part{i}.b64').read_text().strip() for i in range(4)]
          body=base64.b64decode(''.join(parts))
          expected='e05033a7806dde7c5658e61e2ef5c720917c9bff114cced2f4350d001ee87a9c'
          got=hashlib.sha256(body).hexdigest()
          assert got==expected, (got,expected)
          target=root/'exported_scripts'/'0641__id_1065600.rb'
          target.write_bytes(body)

          idx=root/'exported_scripts'/'SCRIPT_INDEX.tsv'
          old=idx.read_text(encoding='utf-8').splitlines()
          keep=[]
          for line in old:
            if not line.strip(): continue
            try: n=int(line.split('\t',1)[0])
            except: continue
            if n<=640: keep.append(line)
          def row(n,sid,name,path):
            b=(root/'exported_scripts'/path).read_bytes()
            return f'{n}\t{sid}\t{name}\t{path}\t{len(b)}\t{hashlib.sha256(b).hexdigest()}'
          keep.append(row(641,1065600,'PMD AutoChess VXRD Random Hunt Real Loading Overlay I v1.06.56','0641__id_1065600.rb'))
          keep.append(row(642,250,'Main','0642__id_250.rb'))
          keep.append(row(643,251,'','0643__id_251.rb'))
          idx.write_text('\n'.join(keep)+'\n',encoding='utf-8')

          order=root/'exported_scripts'/'SCRIPT_ORDER.md'
          lines=['# RPG Maker VX Script Order','','Source: `Data/Scripts.rvdata`','','**Do not reorder.** Runtime order is the numeric `index` below.','']
          for r in keep:
            p=r.split('\t')
            n,sid,name,path=p[0],p[1],p[2],p[3]
            lines.append(f'- {int(n):04d} | ID `{sid}` | `{name}` | `{path}`')
          order.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('script_sha256='+got)
          print('entries='+str(len(keep)))
          PY
      - name: Verify Ruby syntax
        run: ruby -c exported_scripts/0641__id_1065600.rb
      - name: Remove one-shot importer and commit
        shell: bash
        run: |
          git config user.name 'showpei1203'
          git config user.email 'showpei1203@gmail.com'
          git rm -r .v10656_import .github/workflows/v10656_exact_source_finalize.yml
          git add exported_scripts/0641__id_1065600.rb exported_scripts/SCRIPT_INDEX.tsv exported_scripts/SCRIPT_ORDER.md
          git commit -m 'Finalize v1.06.56 exact Scripts Source Authority'
          git push origin develop
