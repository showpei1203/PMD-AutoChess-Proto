name: VXRD Landmark Asset Validator

on:
  push:
    branches: [develop]
    paths:
      - 'tools/asset_validator/**'
      - 'tests/test_vxrd_landmark_validator.py'
      - '.github/workflows/vxrd_landmark_asset_validator.yml'
  pull_request:
    paths:
      - 'tools/asset_validator/**'
      - 'tests/test_vxrd_landmark_validator.py'
      - '.github/workflows/vxrd_landmark_asset_validator.yml'

permissions:
  contents: read

jobs:
  validator-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Syntax check
        run: python -m py_compile tools/asset_validator/validate_vxrd_landmark_atlas.py tests/test_vxrd_landmark_validator.py
      - name: Synthetic validator regression
        run: python tests/test_vxrd_landmark_validator.py
      - name: Confirm binary-free GitHub asset policy
        shell: bash
        run: |
          set -euo pipefail
          if find asset_staging/VXRD_Landmarks -type f \( -iname '*.png' -o -iname '*.zip' -o -iname '*.rvdata' \) | grep -q .; then
            echo 'Forbidden binary asset found under GitHub asset staging.' >&2
            exit 1
          fi
          echo 'BINARY_ASSET_POLICY=PASS'
