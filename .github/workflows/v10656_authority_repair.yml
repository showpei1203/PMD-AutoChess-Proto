name: v1.06.56 Scripts Authority Repair
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/v10656_authority_repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Verify and rebuild manifests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          script=root/'exported_scripts'/'0641__id_1065600.rb'
          body=script.read_bytes()
          got=hashlib.sha256(body).hexdigest()
          expected='029c0a557ac44677d24110f8ca7be2933aa0c9296f5dc440e989f551d64f7d28'
          assert got==expected, (got, expected)
          idx=root/'exported_scripts'/'SCRIPT_INDEX.tsv'
          old=idx.read_text(encoding='utf-8').splitlines()
          keep=[]
          for line in old:
              if not line.strip():
                  continue
              try:
                  n=int(line.split('\t',1)[0])
              except Exception:
                  continue
              if n <= 640:
                  keep.append(line)
          def row(n,sid,name,path):
              b=(root/'exported_scripts'/path).read_bytes()
              return f'{n}\t{sid}\t{name}\t{path}\t{len(b)}\t{hashlib.sha256(b).hexdigest()}'
          keep.append(row(641,1065600,'PMD AutoChess VXRD Random Hunt Real Loading Overlay I v1.06.56','0641__id_1065600.rb'))
          keep.append(row(642,250,'Main','0642__id_250.rb'))
          keep.append(row(643,251,'','0643__id_251.rb'))
          assert len(keep)==644, len(keep)
          idx.write_text('\n'.join(keep)+'\n',encoding='utf-8')
          order=root/'exported_scripts'/'SCRIPT_ORDER.md'
          lines=['# RPG Maker VX Script Order','','Source: `Data/Scripts.rvdata`','','**Do not reorder.** Runtime order is the numeric `index` below.','']
          for r in keep:
              p=r.split('\t')
              lines.append(f'- {int(p[0]):04d} | ID `{p[1]}` | `{p[2]}` | `{p[3]}`')
          order.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('script_sha256='+got)
          print('entries='+str(len(keep)))
          PY
          ruby -c exported_scripts/0641__id_1065600.rb
          tail -n 4 exported_scripts/SCRIPT_INDEX.tsv
      - name: Commit repaired authority and remove workflow
        shell: bash
        run: |
          git config user.name 'showpei1203'
          git config user.email 'showpei1203@gmail.com'
          git rm .github/workflows/v10656_authority_repair.yml
          git add exported_scripts/SCRIPT_INDEX.tsv exported_scripts/SCRIPT_ORDER.md
          git commit -m 'Repair v1.06.56 Scripts Source Authority manifests'
          git push origin develop
