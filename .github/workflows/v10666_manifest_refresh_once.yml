name: v1.06.66 Canonical Manifest Refresh Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/v10666_manifest_refresh.trigger'

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'ops/v10666-manifest-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Refresh canonical tail
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          root=Path('exported_scripts')
          idx=root/'SCRIPT_INDEX.tsv'
          order=root/'SCRIPT_ORDER.md'

          lines=idx.read_text(encoding='utf-8').splitlines()
          keep=[x for x in lines if x and int(x.split('\t',1)[0]) <= 645]
          tail=[
            (646,1066300,'PMD AutoChess Gate 3 Completion Incentive + Retreat Clarity I v1.06.63','0646__id_1066300.rb'),
            (647,1066400,'PMD AutoChess Gate 3 Run Accounting Semantic Persistence I v1.06.64','0647__id_1066400.rb'),
            (648,1066600,'PMD AutoChess Gate 3 Integrated Seal Convergence I v1.06.66','0648__id_1066600.rb'),
            (649,250,'Main','0649__id_250.rb'),
            (650,251,'','0650__id_251.rb'),
          ]
          for i,sid,name,fn in tail:
            b=(root/fn).read_bytes()
            keep.append(f'{i}\t{sid}\t{name}\t{fn}\t{len(b)}\t{hashlib.sha256(b).hexdigest()}')
          assert len(keep)==651, len(keep)
          assert keep[-3].split('\t')[1]=='1066600'
          idx.write_text('\n'.join(keep)+'\n',encoding='utf-8')

          ol=order.read_text(encoding='utf-8').splitlines()
          prefix=[]
          for x in ol:
            if x.startswith('- 0646'):
              break
            prefix.append(x)
          while prefix and prefix[-1]=='': prefix.pop()
          prefix += ['', '- 0646 | ID `1066300` | `PMD AutoChess Gate 3 Completion Incentive + Retreat Clarity I v1.06.63` | `0646__id_1066300.rb`',
            '- 0647 | ID `1066400` | `PMD AutoChess Gate 3 Run Accounting Semantic Persistence I v1.06.64` | `0647__id_1066400.rb`',
            '- 0648 | ID `1066600` | `PMD AutoChess Gate 3 Integrated Seal Convergence I v1.06.66` | `0648__id_1066600.rb`',
            '- 0649 | ID `250` | `Main` | `0649__id_250.rb`',
            '- 0650 | ID `251` | `` | `0650__id_251.rb`']
          text='\n'.join(prefix)+'\n'
          text=text.replace('Total Scripts: 648','Total Scripts: 651').replace('Total Scripts: 650','Total Scripts: 651')
          order.write_text(text,encoding='utf-8')

          evidence=Path('tests/MANIFEST_REFRESH_v1.06.66.log')
          evidence.write_text('PMD AutoChess v1.06.66 Canonical Manifest Refresh\nRESULT=PASS\nSCRIPTS=651\nINDEX_RANGE=0..650\nV10663_INDEX=646\nV10664_INDEX=647\nV10666_INDEX=648\nMAIN_INDEX=649\nTERMINATOR_INDEX=650\nSOURCE=CANONICAL_EXPORTED_SCRIPT_BYTES\n',encoding='utf-8')

          Path('.github/workflows/v10666_manifest_refresh_once.yml').unlink()
          trig=Path('.github/v10666_manifest_refresh.trigger')
          if trig.exists(): trig.unlink()
      - name: Commit refreshed manifests
        run: |
          git config user.name 'PMD Authority Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh v1.06.66 canonical script manifests'
          git push origin HEAD:${{ github.head_ref }}
