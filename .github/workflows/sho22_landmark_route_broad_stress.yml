name: SHO-22 Landmark Route Broad Stress

on:
  push:
    branches: [develop]
    paths:
      - 'tests/LANDMARK_ROUTE_BROAD_STRESS_v1.06.56_BASELINE.rb'
      - 'exported_scripts/0567__id_99630079.rb'
      - 'exported_scripts/0640__id_1065500.rb'
      - '.github/workflows/sho22_landmark_route_broad_stress.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  route-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Ruby version
        run: ruby -v
      - name: Syntax check harness
        run: ruby -c tests/LANDMARK_ROUTE_BROAD_STRESS_v1.06.56_BASELINE.rb
      - name: Run broad route stress
        run: ruby tests/LANDMARK_ROUTE_BROAD_STRESS_v1.06.56_BASELINE.rb | tee SHO22_ROUTE_BROAD_STRESS.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHO22_ROUTE_BROAD_STRESS
          path: SHO22_ROUTE_BROAD_STRESS.log
      - name: Commit PASS evidence
        if: success()
        shell: bash
        run: |
          cp SHO22_ROUTE_BROAD_STRESS.log tests/SHO22_ROUTE_BROAD_STRESS_EVIDENCE.txt
          git config user.name 'showpei1203'
          git config user.email 'showpei1203@gmail.com'
          git add tests/SHO22_ROUTE_BROAD_STRESS_EVIDENCE.txt
          git commit -m 'Record SHO-22 broad route stress PASS evidence' || exit 0
          git push origin HEAD:develop
