name: Apply v1.06.54 Source Authority metadata
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-v10654-source-metadata.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Update source metadata and docs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib

          root=Path('.')
          script=root/'exported_scripts/0639__id_1065400.rb'
          data=script.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          assert sha == '0e95efef9810bae1e0dadf3af1170304cd3c879b0efc394b77500a56d2c6429c', sha
          assert len(data) == 19131, len(data)

          idx=root/'exported_scripts/SCRIPT_INDEX.tsv'
          lines=idx.read_text(encoding='utf-8').splitlines()
          assert lines[-2].startswith('639\t250\tMain\t')
          assert lines[-1].startswith('640\t251\t')
          lines=lines[:-2]+[
            '639\t1065400\tPMD AutoChess VXRD Landmark Single-Prop Semantic Presence Collision I v1.06.54\t0639__id_1065400.rb\t19131\t0e95efef9810bae1e0dadf3af1170304cd3c879b0efc394b77500a56d2c6429c',
            '640\t250\tMain\t0640__id_250.rb\t571\t8fdfe50524b8d32a91901e636c6100dba33a42baa6ff09a8153f31786a585558',
            '641\t251\t\t0641__id_251.rb\t0\te3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855']
          idx.write_text('\n'.join(lines)+'\n',encoding='utf-8')

          order=root/'exported_scripts/SCRIPT_ORDER.md'
          ol=order.read_text(encoding='utf-8').splitlines()
          assert ol[-2].startswith('- 0639 | ID `250`')
          assert ol[-1].startswith('- 0640 | ID `251`')
          ol=ol[:-2]+[
            '- 0639 | ID `1065400` | `PMD AutoChess VXRD Landmark Single-Prop Semantic Presence Collision I v1.06.54` | `0639__id_1065400.rb`',
            '- 0640 | ID `250` | `Main` | `0640__id_250.rb`',
            '- 0641 | ID `251` | `` | `0641__id_251.rb`']
          order.write_text('\n'.join(ol)+'\n',encoding='utf-8')

          (root/'exported_scripts/0639__id_250.rb').unlink()
          (root/'exported_scripts/0640__id_251.rb').unlink()

          (root/'README.md').write_text('''# PMD AutoChess Proto\n\nRPG Maker VX / RGSS2 source-control repository.\n\n## Authority\n- `main`: latest formal Windows/RMVX PASS / SEALED source only. Current formal source baseline: **v1.06.35**.\n- `develop`: current unpassed development candidate. Current candidate: **v1.06.54**.\n- Binary `.rvdata`, Graphics/Audio, complete game ZIPs, builds and runtime logs belong in Google Drive, not GitHub.\n\n## Script export\n`exported_scripts/` preserves the exact RPG Maker VX `Scripts.rvdata` execution order.\n- `SCRIPT_INDEX.tsv`: numeric index, Script ID, Script Name, file, byte count, SHA-256.\n- `SCRIPT_ORDER.md`: human-readable order.\n- each `.rb`: exact decompressed script body. Do not reorder merely for repository aesthetics.\n\n## Current develop state\n- v1.06.53 failed real-machine Landmark visual acceptance.\n- v1.06.54 repairs single-prop rendering, guaranteed presence and local hard/soft Landmark collision semantics.\n- `main` is not promoted; v1.06.35 remains formal PASS.\n''',encoding='utf-8')

          (root/'CHANGELOG.md').write_text('''# CHANGELOG\n\n## v1.06.54 — Current Development Candidate (UNPASSED)\n- Repairs v1.06.53 real-machine Visual FAIL.\n- Renders one 32x32 atlas cell per Landmark instead of the full 64x64 2x2 collage.\n- Uses 1x1 logical footprints and a minimum-presence gate for H01/H04/H09/H14/H19.\n- H01 foliage/flowers remain passable; H04/H09/H14/H19 rock/crystal/ore props use local blocking collision.\n- Automatic B/C/D/E map tile stamping remains disabled; v1.06.44 runtime IDs remain revoked.\n- Full Landmark route audit remains deferred pending five-Hunt visual/interaction PASS.\n\n## v1.06.53 — Real-machine Visual FAIL\n- H01/H04/H09/H14 showed no Landmark.\n- H19 displayed a full 64x64 atlas as four unrelated objects in one 2x2 block.\n- Hard rock/ore visuals were pass-through.\n\n## Baseline\n- v1.06.35 remains formal Gate 1 PASS until a later candidate receives real-machine PASS.\n''',encoding='utf-8')

          docs=root/'docs'; docs.mkdir(exist_ok=True)
          (docs/'UPDATE_INFO_v1.06.54.txt').write_text('''PMD AutoChess Proto v1.06.54\nVXRD Landmark Single-Prop Semantic / Presence / Collision Fix I\n\nStatus: UNPASSED CANDIDATE\nFormal Baseline remains v1.06.35.\nv1.06.53 real-machine visual acceptance = FAIL.\n\nFixes:\n- One 32x32 atlas cell per Landmark; never the full 64x64 2x2 collage.\n- 1x1 logical footprint.\n- H01/H04/H09/H14/H19 minimum presence gate.\n- H01 foliage/flowers passable.\n- H04/H09/H14/H19 hard rock/crystal/ore blocking.\n- No automatic B/C/D/E map tile stamping.\n- v1.06.44 runtime IDs remain revoked.\n- Full route audit remains deferred.\n''',encoding='utf-8')

          (docs/'教學_v1.06.54.txt').write_text('''PMD AutoChess Proto v1.06.54 測試與使用說明（繁體中文）\n\n【重要】\n本版更新 Data/Scripts.rvdata。覆蓋前請完全關閉 RPG Maker VX，覆蓋後重新開啟 RMVX。\n\n【本輪只測】\nH01 / H04 / H09 / H14 / H19\n\n【確認】\n1. 每張 Hunt 至少看得到 1 個 Landmark。\n2. 一個 Landmark 只是一個 32x32 單一物件，不可再出現四個物件擠成 2x2。\n3. 物件靠房間邊緣，彼此不要緊貼成堆。\n4. H01 花草／低植被可走過。\n5. H04 岩石、H09 晶岩、H14 礦石、H19 火山岩／礦晶不可走過。\n6. 相機捲動時 Landmark 跟著地圖；換 Hunt／換層後舊物件消失。\n\n主要提供截圖即可；除非 Runtime／戰鬥錯誤，不需要 Battle LOG。\n五張全部 PASS 後才進完整 collision + route audit。\n''',encoding='utf-8')

          (docs/'VXRD_LANDMARK_SINGLE_PROP_SEMANTIC_FIX_v1.06.54.md').write_text('''# VXRD Landmark Single-Prop Semantic / Presence / Collision Fix v1.06.54\n\n## v1.06.53 failure\n- H01/H04/H09/H14: no visible Landmark.\n- H19: full 64x64 source atlas rendered as four unrelated 32x32 props in one 2x2 block.\n- Hard rock/ore/crystal visuals were pass-through.\n\n## v1.06.54\n- Render one 32x32 atlas cell via `Sprite#src_rect`.\n- Logical footprint 1x1.\n- Minimum presence for H01/H04/H09/H14/H19, with safe non-entrance/non-exit fallback rooms.\n- H01 is soft/passable; H04/H09/H14/H19 are hard/blocking.\n- Event reservation remains active.\n- Full route audit is still deferred.\n\n## Invariants\n- No B/C/D/E map table stamping.\n- No revoked v1.06.44 runtime upper-tile IDs.\n- No battle/reward/progression change.\n''',encoding='utf-8')

          tests=root/'tests'; tests.mkdir(exist_ok=True)
          (tests/'STATIC_VALIDATION_FULL_v1.06.54.log').write_text('''PMD AutoChess v1.06.54 STATIC VALIDATION FULL\nRESULT=PASS\nCHECKS=23 FAILURES=0\nSCRIPT_COUNT=642\nNEW_SCRIPT_INDEX=639\nNEW_SCRIPT_ID=1065400\nNEW_SCRIPT_SHA256=0e95efef9810bae1e0dadf3af1170304cd3c879b0efc394b77500a56d2c6429c\nMAIN_INDEX=640\nTERMINATOR_INDEX=641\nPROFILE_CODES=H01,H04,H09,H14,H19\nRENDERER=PNG_ATLAS_CELL_32X32\nLOGICAL_FOOTPRINT=1X1\nLOCAL_SEMANTIC_COLLISION=1\nMAP_TABLE_BCDE_STAMPING=0\nMAP091_CHANGED=0\nLANDMARK_PNG_FILES_CHANGED=0\nREAL_MACHINE_ACCEPTANCE=PENDING\n''',encoding='utf-8')

          (tests/'LANDMARK_SEMANTIC_STATIC_AUDIT_v1.06.54.log').write_text('''PMD AutoChess VXRD Landmark Semantic Static Audit v1.06.54\nRESULT=PASS\nFULL_64X64_COLLAGE_RENDERED=0\nMINIMUM_VISIBLE_PRESENCE=1\nH01_SOFT_PASSABLE=1\nH04_HARD_BLOCKING=1\nH09_HARD_BLOCKING=1\nH14_HARD_BLOCKING=1\nH19_HARD_BLOCKING=1\nHARD_PROP_SPACING=5\nFULL_ROUTE_AUDIT=0\nBATTLE_AI_CHANGED=0\nREWARD_CHANGED=0\nPROGRESSION_CHANGED=0\n''',encoding='utf-8')
          PY
          rm -f .github/workflows/apply-v10654-source-metadata.yml
          if find . -type f \( -name '*.rvdata' -o -name '*.zip' -o -name '*.png' -o -name '*.ogg' -o -name '*.wav' -o -name '*.mp3' \) | grep -q .; then
            echo 'Forbidden binary file found in GitHub Source Authority' >&2
            exit 1
          fi
          git config user.name 'showpei1203'
          git config user.email 'showpei1203@gmail.com'
          git add -A
          git commit -m 'Finalize v1.06.54 unpassed Candidate Source Authority'
          git push origin HEAD:develop
