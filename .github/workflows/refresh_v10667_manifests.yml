name: Refresh v1.06.67 script manifests
on:
  push:
    branches:
      - showpei1203/sho-55-p8-formal-cross-gate-regression
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[manifest-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh manifests
        run: python3 tools/refresh_script_manifests.py
      - name: Commit manifest refresh if needed
        run: |
          if git diff --quiet -- exported_scripts/SCRIPT_INDEX.tsv exported_scripts/SCRIPT_ORDER.md; then
            echo "Manifests already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- exported_scripts/SCRIPT_INDEX.tsv exported_scripts/SCRIPT_ORDER.md
          git commit -m "Refresh v1.06.67 script manifests [manifest-refresh]"
          git push origin HEAD:${GITHUB_REF_NAME}
