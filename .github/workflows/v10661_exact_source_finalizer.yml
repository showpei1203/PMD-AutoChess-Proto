name: v1.06.61 Exact Source Finalizer

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'v10661-source-finalize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize canonical v1.06.61 tail
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          root=Path('.')
          staging=root/'candidate_staging/VXRD_A1_LIQUID_SURFACE_SEMANTIC_AUTHORITY_II_v1.06.61.rb'
          exp=root/'exported_scripts'
          workflow=root/'.github/workflows/v10661_exact_source_finalizer.yml'
          src=staging.read_bytes()
          src_sha=hashlib.sha256(src).hexdigest()
          expected='a07d64dafa83d30958edd6045281f820c9e08831ea56757d0e977e8b58461d7d'
          assert src_sha==expected, (src_sha, expected)

          old_main=exp/'0644__id_250.rb'
          old_term=exp/'0645__id_251.rb'
          assert old_main.exists() and old_term.exists()
          main=old_main.read_bytes(); term=old_term.read_bytes()
          assert hashlib.sha256(main).hexdigest()=='8fdfe50524b8d32a91901e636c6100dba33a42baa6ff09a8153f31786a585558'
          assert hashlib.sha256(term).hexdigest()=='e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'

          (exp/'0644__id_1066100.rb').write_bytes(src)
          (exp/'0645__id_250.rb').write_bytes(main)
          (exp/'0646__id_251.rb').write_bytes(term)
          old_main.unlink(); old_term.unlink()

          tsv=exp/'SCRIPT_INDEX.tsv'
          lines=tsv.read_text(encoding='utf-8').splitlines()
          assert len(lines)==646
          assert lines[643].startswith('643\t1065800\t')
          lines=lines[:644]
          lines += [
            f"644\t1066100\tPMD AutoChess VXRD A1 Liquid Surface Semantic Authority II v1.06.61\t0644__id_1066100.rb\t{len(src)}\t{src_sha}",
            f"645\t250\tMain\t0645__id_250.rb\t{len(main)}\t{hashlib.sha256(main).hexdigest()}",
            f"646\t251\t\t0646__id_251.rb\t{len(term)}\t{hashlib.sha256(term).hexdigest()}"
          ]
          tsv.write_text('\n'.join(lines),encoding='utf-8')

          order=exp/'SCRIPT_ORDER.md'
          olines=order.read_text(encoding='utf-8').splitlines()
          cut=None
          for i,line in enumerate(olines):
            if line.startswith('- 0644 |'):
              cut=i; break
          assert cut is not None
          assert any(line.startswith('- 0643 | ID `1065800`') for line in olines[:cut])
          olines=olines[:cut]
          olines += [
            '- 0644 | ID `1066100` | `PMD AutoChess VXRD A1 Liquid Surface Semantic Authority II v1.06.61` | `0644__id_1066100.rb`',
            '- 0645 | ID `250` | `Main` | `0645__id_250.rb`',
            '- 0646 | ID `251` | `` | `0646__id_251.rb`'
          ]
          order.write_text('\n'.join(olines),encoding='utf-8')

          proof=root/'tests/SOURCE_FINALIZATION_v1.06.61.log'
          proof.write_text(
            'RESULT=PASS\nSCRIPT_COUNT=647\nINDEX_RANGE=0..646\n'
            'V10661_INDEX=644\nV10661_ID=1066100\nV10661_SHA256='+src_sha+'\n'
            'MAIN_INDEX=645\nTERMINATOR_INDEX=646\nSTAGING_REMOVED=1\n',encoding='utf-8')

          staging.unlink()
          try: staging.parent.rmdir()
          except OSError: pass
          workflow.unlink()

      - name: Commit finalized source tree
        run: |
          git config user.name "PMD Source Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize v1.06.61 canonical source tail"
          git push origin HEAD:${{ github.head_ref }}
