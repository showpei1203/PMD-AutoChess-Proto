name: v1.06.58 Canonical Source Seal

on:
  pull_request:
    branches: [develop]
    paths:
      - '.v10658_seal_trigger'

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Seal canonical v1.06.58 Script Source Authority
        shell: bash
        run: |
          set -euo pipefail
          sha57='be91725e395e87bb79553d11d0bb125f913d7e8f2aabf164609e688e4e820ede'
          sha58='aae49d6c64fbacbba1b077a42992a5f4e954a75876ce6ba155f58b1a1c2ff7b1'
          sha_main='8fdfe50524b8d32a91901e636c6100dba33a42baa6ff09a8153f31786a585558'
          test "$(sha256sum exported_scripts/0642__id_1065700.rb | awk '{print $1}')" = "$sha57"
          test "$(sha256sum .v10658_import/0643__id_1065800.rb | awk '{print $1}')" = "$sha58"
          test "$(sha256sum exported_scripts/0643__id_250.rb | awk '{print $1}')" = "$sha_main"
          test -f exported_scripts/0643__id_251.rb
          test ! -s exported_scripts/0643__id_251.rb
          ruby -c exported_scripts/0642__id_1065700.rb
          ruby -c .v10658_import/0643__id_1065800.rb

          mv exported_scripts/0643__id_250.rb exported_scripts/0644__id_250.rb
          mv exported_scripts/0643__id_251.rb exported_scripts/0645__id_251.rb
          mv .v10658_import/0643__id_1065800.rb exported_scripts/0643__id_1065800.rb

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          idx=root/'exported_scripts'/'SCRIPT_INDEX.tsv'
          old=[]
          for line in idx.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              p=line.split('\t')
              if int(p[0]) <= 641:
                  old.append(line)
          def row(n,sid,name,path):
              b=(root/'exported_scripts'/path).read_bytes()
              return f'{n}\t{sid}\t{name}\t{path}\t{len(b)}\t{hashlib.sha256(b).hexdigest()}'
          rows=old + [
              row(642,1065700,'PMD AutoChess VXRD Landmark Vegetation Wetland Coverage Expansion I v1.06.57','0642__id_1065700.rb'),
              row(643,1065800,'PMD AutoChess VXRD Water-Bottom Autotile Pair Authority I v1.06.58','0643__id_1065800.rb'),
              row(644,250,'Main','0644__id_250.rb'),
              row(645,251,'','0645__id_251.rb'),
          ]
          assert len(rows)==646, len(rows)
          assert [int(r.split('\t')[0]) for r in rows] == list(range(646))
          idx.write_text('\n'.join(rows)+'\n',encoding='utf-8')
          order=root/'exported_scripts'/'SCRIPT_ORDER.md'
          out=['# RPG Maker VX Script Order','','Source: `Data/Scripts.rvdata`','','**Do not reorder.** Runtime order is the numeric `index` below.','']
          for r in rows:
              p=r.split('\t')
              out.append(f'- {int(p[0]):04d} | ID `{p[1]}` | `{p[2]}` | `{p[3]}`')
          order.write_text('\n'.join(out)+'\n',encoding='utf-8')
          expected={
              642:'be91725e395e87bb79553d11d0bb125f913d7e8f2aabf164609e688e4e820ede',
              643:'aae49d6c64fbacbba1b077a42992a5f4e954a75876ce6ba155f58b1a1c2ff7b1',
              644:'8fdfe50524b8d32a91901e636c6100dba33a42baa6ff09a8153f31786a585558',
              645:'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855',
          }
          for n,h in expected.items():
              got=rows[n].split('\t')[5]
              assert got==h,(n,got,h)
          print('entries=646')
          print('tail=642:v10657,643:v10658,644:Main,645:terminator')
          print('index_sha256='+hashlib.sha256(idx.read_bytes()).hexdigest())
          print('order_sha256='+hashlib.sha256(order.read_bytes()).hexdigest())
          PY

          rm -rf .v10657_import .v10658_import
          rm -f .v10658_seal_trigger
          rm -f .github/workflows/v10657_exact_source_finalize.yml

          git config user.name 'showpei1203'
          git config user.email 'showpei1203@gmail.com'
          git add -A
          git commit -m 'Seal v1.06.58 canonical Scripts Source Authority'
          git push origin HEAD:${{ github.head_ref }}
