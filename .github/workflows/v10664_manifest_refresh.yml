name: v1.06.64 Canonical Manifest Refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild canonical tail manifests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('exported_scripts')
          tail=[
            (646,1066300,'PMD AutoChess Gate 3 Completion Incentive + Retreat Clarity I v1.06.63','0646__id_1066300.rb'),
            (647,1066400,'PMD AutoChess Gate 3 Run Accounting Semantic Persistence I v1.06.64','0647__id_1066400.rb'),
            (648,250,'Main','0648__id_250.rb'),
            (649,251,'','0649__id_251.rb'),
          ]
          idx_path=root/'SCRIPT_INDEX.tsv'
          old_idx=idx_path.read_text(encoding='utf-8').splitlines()
          base=[]
          for line in old_idx:
            if not line.strip():
              continue
            try:
              i=int(line.split('\t',1)[0])
            except Exception:
              continue
            if i<=645:
              base.append(line)
          if len(base)!=646:
            raise SystemExit('base index count != 646: %d' % len(base))
          new_idx=list(base)
          for i,sid,name,fn in tail:
            b=(root/fn).read_bytes()
            sha=hashlib.sha256(b).hexdigest()
            new_idx.append('\t'.join([str(i),str(sid),name,fn,str(len(b)),sha]))
          if len(new_idx)!=650:
            raise SystemExit('index count != 650')
          idx_path.write_text('\n'.join(new_idx)+'\n',encoding='utf-8',newline='\n')

          order_path=root/'SCRIPT_ORDER.md'
          old_order=order_path.read_text(encoding='utf-8').splitlines()
          header=[]; entries=[]
          for line in old_order:
            if line.startswith('- ') and len(line)>=6 and line[2:6].isdigit():
              i=int(line[2:6])
              if i<=645:
                entries.append(line)
            elif not entries:
              header.append(line)
          if len(entries)!=646:
            raise SystemExit('base order count != 646: %d' % len(entries))
          new_order=header+entries
          for i,sid,name,fn in tail:
            new_order.append('- %04d | ID `%s` | `%s` | `%s`' % (i,sid,name,fn))
          order_path.write_text('\n'.join(new_order)+'\n',encoding='utf-8',newline='\n')

          expected={
            '0646__id_1066300.rb':'bf3ed879de7ab6f6a435040311c32a418c155a28ea03e307643e63dee5a78aa8',
            '0647__id_1066400.rb':'a17f14791cfb50296caefc829931f66d0f6c8fb6ec7e9072d09dfa0629d288ed',
            '0648__id_250.rb':'8fdfe50524b8d32a91901e636c6100dba33a42baa6ff09a8153f31786a585558',
            '0649__id_251.rb':'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855',
          }
          for fn,want in expected.items():
            got=hashlib.sha256((root/fn).read_bytes()).hexdigest()
            if got!=want:
              raise SystemExit('%s sha mismatch %s != %s' % (fn,got,want))
          if (root/'0647__id_250.rb').exists() or (root/'0648__id_251.rb').exists():
            raise SystemExit('stale formal tail file remains')
          print('MANIFEST_REFRESH=PASS scripts=650 range=0..649')
          PY
      - name: Commit manifests and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exported_scripts/SCRIPT_INDEX.tsv exported_scripts/SCRIPT_ORDER.md
          git rm .github/workflows/v10664_manifest_refresh.yml
          git commit -m 'Refresh canonical manifests for v1.06.64 Formal'
          git push
